<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TT World — Goa Trip</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
--bg:#f4f6fb;--surface:#ffffff;--glass:rgba(255,255,255,0.7);
--glass-border:rgba(0,0,0,0.07);--glass-hover:rgba(255,255,255,0.9);
--text:#1a1d2e;--text-dim:#4a5068;--text-muted:#8a90a4;
--accent:#00897b;--accent-glow:rgba(0,137,123,0.15);--accent2:#1565c0;
--accent3:#e65100;--danger:#d32f2f;--success:#00897b;--wa:#25D366;
--brand-tt:#ffe500;--brand-world:#ffffff;
--radius:16px;--radius-sm:10px;--radius-xs:6px;
--shadow:0 2px 12px rgba(0,0,0,0.06);--shadow-md:0 6px 24px rgba(0,0,0,0.08);--shadow-lg:0 12px 40px rgba(0,0,0,0.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;}
::selection{background:var(--accent);color:#fff;}
::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:#c5c9d6;border-radius:3px;}

.bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.bg-canvas canvas{width:100%;height:100%;}
.bg-gradient{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;
background:radial-gradient(ellipse 70% 50% at 15% 5%,rgba(0,137,123,0.06) 0%,transparent 60%),
radial-gradient(ellipse 60% 50% at 85% 80%,rgba(21,101,192,0.05) 0%,transparent 60%),
radial-gradient(ellipse 50% 40% at 50% 50%,rgba(230,81,0,0.03) 0%,transparent 60%);}

.logo-wrap{position:relative;width:36px;height:36px;border-radius:var(--radius-sm);overflow:hidden;cursor:pointer;flex-shrink:0;background:var(--brand-tt);transition:box-shadow .2s;}
.logo-wrap:hover{box-shadow:0 0 0 2px rgba(255,229,0,0.4);}
.logo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.logo-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;}
.logo-placeholder svg{width:14px;height:14px;color:rgba(26,29,46,0.5);transition:color .2s;}
.logo-wrap:hover .logo-placeholder svg{color:rgba(26,29,46,0.8);}
.logo-ph-label{font-size:6px;font-weight:800;color:rgba(26,29,46,0.35);letter-spacing:.5px;transition:color .2s;}
.logo-wrap:hover .logo-ph-label{color:rgba(26,29,46,0.6);}

.header{position:fixed;top:0;left:0;width:100%;z-index:500;padding:0 24px;height:64px;
display:flex;align-items:center;justify-content:space-between;
background:rgba(26,29,46,0.92);backdrop-filter:blur(16px) saturate(180%);
border-bottom:1px solid rgba(255,255,255,0.06);transition:all .3s;}
.header.scrolled{background:rgba(26,29,46,0.97);box-shadow:0 2px 20px rgba(0,0,0,0.15);}
.h-left{display:flex;align-items:center;gap:12px;}
.h-brand{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:700;color:var(--brand-world);}
.h-brand .tt{color:var(--brand-tt);}
.h-right{display:flex;align-items:center;gap:8px;}
.hamburger{width:38px;height:38px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,0.1);
background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.7);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.hamburger:hover{background:rgba(255,255,255,0.12);border-color:var(--brand-tt);color:var(--brand-tt);}
.h-nav-btn{padding:7px 14px;border-radius:var(--radius-xs);border:1px solid rgba(255,255,255,0.1);
background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.7);font-size:.8rem;font-weight:500;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif;}
.h-nav-btn:hover{background:rgba(255,255,255,0.12);color:#fff;}
.h-nav-btn.cta{background:var(--brand-tt);border-color:transparent;color:var(--text);font-weight:700;}
.h-nav-btn.cta:hover{box-shadow:0 3px 14px rgba(255,229,0,0.3);transform:translateY(-1px);}

.sb-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:600;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(3px);}
.sb-overlay.active{opacity:1;pointer-events:all;}
.sidebar{position:fixed;top:0;right:-290px;width:280px;height:100%;z-index:700;
background:#1a1d2e;border-left:1px solid rgba(255,255,255,0.06);
transition:right .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,0.2);}
.sidebar.active{right:0;}
.sb-header{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.06);}
.sb-header .h-brand{font-size:1.15rem;}
.sb-close{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.6);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.sb-close:hover{background:rgba(211,47,47,0.15);border-color:var(--danger);color:var(--danger);}
.sb-nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:2px;}
.sb-link{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--radius-sm);
color:rgba(255,255,255,0.6);text-decoration:none;font-size:.88rem;font-weight:500;transition:all .2s;border:1px solid transparent;}
.sb-link:hover{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.9);border-color:rgba(255,255,255,0.06);}
.sb-link.active{background:rgba(255,229,0,0.08);color:var(--brand-tt);border-color:rgba(255,229,0,0.15);}
.sb-icon{width:36px;height:36px;border-radius:var(--radius-xs);background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0;transition:all .2s;}
.sb-link:hover .sb-icon{background:rgba(255,255,255,0.08);}
.sb-link.active .sb-icon{background:rgba(255,229,0,0.12);}
.sb-footer{padding:14px 18px;border-top:1px solid rgba(255,255,255,0.06);font-size:.72rem;color:rgba(255,255,255,0.3);}

.main{position:relative;z-index:1;padding-top:64px;}

.hero{position:relative;padding:48px 24px 32px;text-align:center;overflow:hidden;}
.hero::before{content:'';position:absolute;bottom:0;left:0;width:100%;height:80px;background:linear-gradient(to top,var(--bg),transparent);z-index:2;}
.hero-badge{display:inline-flex;align-items:center;gap:7px;padding:5px 14px 5px 7px;border-radius:50px;
background:#fff;border:1px solid var(--glass-border);font-size:.75rem;color:var(--accent);font-weight:600;margin-bottom:18px;box-shadow:var(--shadow);animation:fadeUp .6s ease both;}
.hero-badge .hb-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulseDot 2s ease infinite;}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(1.6);}}
.hero h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,4.5vw,3.4rem);font-weight:800;line-height:1.15;margin-bottom:14px;animation:fadeUp .6s ease .1s both;color:var(--text);}
.hero h1 .gt{background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 200%;animation:gShift 4s ease infinite;}
@keyframes gShift{0%,100%{background-position:0% 50%;}50%{background-position:100% 50%;}}
.hero p{font-size:clamp(.88rem,1.8vw,1rem);color:var(--text-dim);max-width:500px;margin:0 auto 24px;line-height:1.6;animation:fadeUp .6s ease .2s both;}
.hero-stats{display:flex;justify-content:center;gap:28px;animation:fadeUp .6s ease .3s both;flex-wrap:wrap;}
.hero-stat{text-align:center;}
.hero-stat .hv{font-size:1.4rem;font-weight:800;color:var(--text);display:block;}
.hero-stat .hv span{color:var(--accent);}
.hero-stat .hl{font-size:.68rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;font-weight:600;margin-top:1px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}

.fw{max-width:720px;margin:0 auto;padding:0 16px 100px;}

.step-bar{position:sticky;top:64px;z-index:100;padding:14px 0 10px;margin-bottom:6px;
background:rgba(244,246,251,0.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--glass-border);}
.step-track{display:flex;align-items:center;justify-content:center;gap:0;max-width:600px;margin:0 auto;overflow-x:auto;scrollbar-width:none;padding:3px 0;}
.step-track::-webkit-scrollbar{display:none;}
.step-item{display:flex;align-items:center;gap:5px;cursor:pointer;padding:5px 8px;border-radius:50px;transition:all .25s;white-space:nowrap;}
.step-item:hover{background:rgba(0,0,0,0.04);}
.step-dot{width:24px;height:24px;border-radius:50%;border:2px solid #c5c9d6;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;color:#8a90a4;transition:all .35s;flex-shrink:0;background:#fff;}
.step-item.active .step-dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
.step-item.done .step-dot{border-color:var(--accent);background:var(--accent);color:#fff;}
.step-item.error .step-dot{border-color:var(--danger);color:var(--danger);animation:shake .5s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}20%,60%{transform:translateX(-3px);}40%,80%{transform:translateX(3px);}}
.step-label{font-size:.68rem;font-weight:600;color:var(--text-muted);transition:color .25s;}
.step-item.active .step-label{color:var(--accent);}
.step-item.done .step-label{color:var(--accent);}
.step-item.error .step-label{color:var(--danger);}
.step-line{width:14px;height:2px;background:#dde0e8;flex-shrink:0;margin:0 2px;border-radius:1px;transition:background .3s;}
.step-line.filled{background:var(--accent);}

.qc{background:var(--surface);border:1px solid var(--glass-border);border-radius:var(--radius);padding:26px 26px 22px;margin-bottom:14px;transition:all .35s;position:relative;overflow:hidden;box-shadow:var(--shadow);}
.qc::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:transparent;transition:background .3s;border-radius:0 2px 2px 0;}
.qc:hover{box-shadow:var(--shadow-md);}
.qc.filled{border-color:rgba(0,137,123,0.25);}.qc.filled::before{background:var(--accent);}
.qc.has-error{border-color:rgba(211,47,47,0.3);animation:shake .5s ease;}.qc.has-error::before{background:var(--danger);}
.qn{font-size:.68rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;}
.qt{font-size:1.02rem;font-weight:700;color:var(--text);margin-bottom:3px;display:flex;align-items:center;gap:5px;}
.qt .req{color:var(--danger);font-size:1.05rem;}
.qs{font-size:.82rem;color:var(--text-dim);margin-bottom:16px;line-height:1.5;}
.qe{display:none;align-items:center;gap:6px;margin-top:10px;padding:7px 12px;border-radius:var(--radius-xs);
background:#fde8e8;border:1px solid rgba(211,47,47,0.15);font-size:.78rem;color:var(--danger);font-weight:500;}
.qe.show{display:flex;animation:fadeUp .3s ease;}
.qe svg{width:15px;height:15px;flex-shrink:0;}

.ol{display:flex;flex-direction:column;gap:7px;}
.oc{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1.5px solid #e2e6ee;border-radius:var(--radius-sm);cursor:pointer;transition:all .2s;position:relative;overflow:hidden;background:#fafbfe;}
.oc:hover{border-color:#c5c9d6;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.04);}
.oc.sel{border-color:var(--accent);background:rgba(0,137,123,0.04);}
.radio{width:18px;height:18px;border-radius:50%;border:2px solid #b0b5c3;flex-shrink:0;transition:all .2s;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;background:#fff;}
.radio::after{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .2s;}
.oc.sel .radio{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow);}.oc.sel .radio::after{transform:scale(1);}
.check{width:18px;height:18px;border-radius:4px;border:2px solid #b0b5c3;flex-shrink:0;transition:all .2s;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;background:#fff;}
.oc.sel .check{border-color:var(--accent);background:var(--accent);}.oc.sel .check::after{content:'\2713';color:#fff;font-size:11px;font-weight:800;}
.ob{flex:1;position:relative;z-index:1;}
.on{font-size:.88rem;font-weight:600;color:var(--text);transition:color .2s;}.oc.sel .on{color:var(--accent);}
.od{font-size:.74rem;color:var(--text-muted);margin-top:1px;}
.op{font-size:.83rem;font-weight:700;color:var(--accent);white-space:nowrap;position:relative;z-index:1;}
.otag{display:inline-block;padding:1px 7px;border-radius:50px;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-left:5px;}
.otag.free{background:rgba(0,137,123,0.1);color:var(--accent);}
.otag.pop{background:rgba(230,81,0,0.1);color:var(--accent3);}
.otag.skip{background:#f0f2f7;color:var(--text-muted);}
.otag.prem{background:rgba(156,39,176,0.1);color:#7b1fa2;}
.oc.sel .otag.skip{background:#e8eaf0;color:var(--text-dim);}

.pax-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.pax-box{padding:14px;border:1.5px solid #e2e6ee;border-radius:var(--radius-sm);background:#fafbfe;transition:border-color .2s;}
.pax-box.highlight{border-color:rgba(0,137,123,0.3);}
.pax-box label{display:block;font-size:.82rem;font-weight:600;color:var(--text-dim);margin-bottom:8px;}
.pax-ctrl{display:flex;align-items:center;border:1.5px solid #e2e6ee;border-radius:var(--radius-xs);overflow:hidden;background:#fff;}
.pax-btn{width:42px;height:42px;border:none;background:#f5f7fb;cursor:pointer;font-size:18px;font-weight:700;color:var(--text-dim);display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:'Inter',sans-serif;}
.pax-btn:hover{background:#e8eaf0;color:var(--text);}.pax-btn:active{background:#dde0e8;}
.pax-val{flex:1;text-align:center;font-size:1.25rem;font-weight:800;color:var(--text);border:none;outline:none;background:transparent;pointer-events:none;}
.pax-hint{font-size:.68rem;color:var(--text-muted);margin-top:6px;}

.child-ages-section{margin-top:14px;display:none;animation:fadeUp .35s ease;}
.child-ages-section.show{display:block;}
.child-ages-title{font-size:.72rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.child-ages-title .ca-icon{font-size:.85rem;}
.child-ages-grid{display:flex;flex-direction:column;gap:8px;}
.child-age-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #e2e6ee;border-radius:var(--radius-sm);background:#fafbfe;transition:all .2s;}
.child-age-row:hover{border-color:#d0d4de;background:#fff;}
.child-age-label{font-size:.82rem;font-weight:600;color:var(--text-dim);min-width:62px;}
.child-age-input-wrap{display:flex;align-items:center;border:1.5px solid #e2e6ee;border-radius:var(--radius-xs);overflow:hidden;background:#fff;transition:border-color .2s;}
.child-age-input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow);}
.child-age-input{width:44px;height:36px;border:none;outline:none;text-align:center;font-size:1rem;font-weight:700;color:var(--text);background:transparent;font-family:'Inter',sans-serif;-moz-appearance:textfield;}
.child-age-input::-webkit-outer-spin-button,.child-age-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.child-age-unit{padding:0 8px;font-size:.72rem;font-weight:600;color:var(--text-muted);background:#f5f7fb;height:36px;display:flex;align-items:center;border-left:1px solid #e2e6ee;}
.child-age-badge{font-size:.62rem;font-weight:700;padding:3px 8px;border-radius:50px;white-space:nowrap;transition:all .25s;}
.child-age-badge.free-tag{background:rgba(0,137,123,0.1);color:var(--accent);}
.child-age-badge.full{background:#f0f2f7;color:var(--text-muted);}
.child-age-note{font-size:.68rem;color:var(--text-muted);margin-top:6px;line-height:1.4;padding-left:2px;}
.child-age-note b{color:var(--accent);}

.nested{margin:5px 0 0 30px;padding:12px 14px;border:1px solid #e2e6ee;border-radius:var(--radius-sm);background:#f8f9fc;display:none;animation:fadeUp .25s ease;}
.nested.show{display:block;}
.nested-label{font-size:.68rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}

.hp{margin-top:14px;border:1px solid var(--glass-border);border-radius:var(--radius);overflow:hidden;background:#fff;display:none;animation:fadeUp .3s ease;box-shadow:var(--shadow-md);}
.hp.show{display:block;}
.hp-sl{position:relative;height:260px;overflow:hidden;background:#eef1f6;}
.hp-sl img{width:100%;height:100%;object-fit:cover;transition:opacity .4s;}
.hp-sb{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,0.9);color:var(--text);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:5;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,0.12);}
.hp-sb:hover{background:#fff;box-shadow:0 3px 12px rgba(0,0,0,0.15);}
.hp-sb.l{left:10px;}.hp-sb.r{right:10px;}
.hp-ctr{position:absolute;bottom:10px;right:10px;padding:3px 9px;border-radius:50px;background:rgba(0,0,0,0.55);backdrop-filter:blur(6px);font-size:.7rem;font-weight:600;color:#fff;z-index:5;}
.hp-info{padding:16px 18px;text-align:center;border-bottom:1px solid #eef1f6;}
.hp-name{font-size:1.1rem;font-weight:700;color:var(--text);margin-bottom:3px;}
.hp-rating{display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border-radius:50px;background:#f5f7fb;border:1px solid var(--glass-border);}
.hp-stars{color:#f9a825;font-size:.85rem;letter-spacing:1px;}
.hp-score{font-size:.8rem;font-weight:700;color:var(--accent);}
.hp-tabs{display:flex;border-bottom:1px solid #eef1f6;background:#fafbfe;}
.hp-tab{flex:1;padding:10px;text-align:center;font-size:.78rem;font-weight:600;color:var(--text-muted);cursor:pointer;border:none;background:transparent;transition:all .2s;border-bottom:2px solid transparent;font-family:'Inter',sans-serif;}
.hp-tab:hover{color:var(--text);background:#f0f2f7;}
.hp-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:#fff;}
.hp-content{padding:16px 18px;min-height:70px;}
.hp-content p{font-size:.84rem;color:var(--text-dim);line-height:1.6;}
.hp-loc{font-size:.8rem;color:var(--text-muted);margin-top:6px;display:flex;align-items:flex-start;gap:5px;}
.hp-btns{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;}
.hp-btn{padding:7px 16px;border-radius:var(--radius-xs);border:none;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:5px;font-family:'Inter',sans-serif;}
.hp-btn.primary{background:var(--accent2);color:#fff;}
.hp-btn.primary:hover{box-shadow:0 3px 12px rgba(21,101,192,0.25);transform:translateY(-1px);}
.hp-btn.ghost{background:#f0f2f7;border:1px solid var(--glass-border);color:var(--text-dim);}
.hp-btn.ghost:hover{background:#e8eaf0;color:var(--text);}

.sse{margin:5px 0 0 30px;border:1px solid #e2e6ee;border-radius:var(--radius);overflow:hidden;background:#fff;display:none;animation:fadeUp .3s ease;box-shadow:var(--shadow);}
.sse.show{display:block;}
.ss-sw{position:relative;padding:12px;overflow:hidden;}
.ss-sl{display:flex;gap:8px;transition:transform .3s ease;}
.ss-c{min-width:140px;border-radius:var(--radius-sm);overflow:hidden;background:#fafbfe;border:1px solid #e2e6ee;flex-shrink:0;transition:all .2s;}
.ss-c:hover{border-color:#c5c9d6;transform:translateY(-2px);box-shadow:0 3px 10px rgba(0,0,0,0.06);}

/* Children under 5 = completely free (0), 5+ = full price (1) */
function ppl(){
  let p=S.adults;
  for(const age of S.childAges){
    if(age>=5) p+=1;
  }
  return p;
}
function fmtPplBreakdown(){
  let parts=[S.adults+' Adult'+(S.adults>1?'s':'')];
  if(S.childAges.length>0){
    let u5=S.childAges.filter(a=>a<5).length;
    let o5=S.childAges.filter(a=>a>=5).length;
    if(u5>0) parts.push(u5+' Child'+(u5>1?'ren':'')+' (below 5, free)');
    if(o5>0) parts.push(o5+' Child'+(o5>1?'ren':'')+' (5+, full price)');
  }
  return parts.join(', ');
}

function initBg(){const c=$('bgCanvas'),ctx=c.getContext('2d');let w,h,pts=[];function rs(){w=c.width=innerWidth;h=c.height=innerHeight;}rs();addEventListener('resize',rs);for(let i=0;i<40;i++)pts.push({x:Math.random()*w,y:Math.random()*h,r:Math.random()*2+.5,dx:(Math.random()-.5)*.18,dy:(Math.random()-.5)*.18,o:Math.random()*.1+.03});function dr(){ctx.clearRect(0,0,w,h);for(const p of pts){p.x+=p.dx;p.y+=p.dy;if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(0.5,p.r),0,Math.PI*2);ctx.fillStyle='rgba(0,137,123,'+p.o+')';ctx.fill();}for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<130){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle='rgba(21,101,192,'+(0.035*(1-d/130))+')';ctx.stroke();}}requestAnimationFrame(dr);}dr();}

function renderChildAges(){
  const wrap=$('childAgesWrap');
  if(!wrap)return;
  if(S.children===0){wrap.classList.remove('show');wrap.innerHTML='';return;}
  wrap.classList.add('show');
  let h='<div class="child-ages-title"><span class="ca-icon">\uD83D\uDC66</span> Enter age for each child</div><div class="child-ages-grid">';
  for(let i=0;i<S.children;i++){
    const age=S.childAges[i]!==undefined?S.childAges[i]:0;
    const isFree=age<5;
    h+='<div class="child-age-row">';
    h+='<span class="child-age-label">Child '+(i+1)+'</span>';
    h+='<div class="child-age-input-wrap">';
    h+='<input type="number" class="child-age-input" id="ca-'+i+'" min="0" max="17" value="'+age+'" oninput="updateChildAge('+i+',this.value)" onfocus="this.select()">';
    h+='<span class="child-age-unit">yrs</span>';
    h+='</div>';
    h+='<span class="child-age-badge '+(isFree?'free-tag':'full')+'" id="cab-'+i+'">'+(isFree?'Free':'Full price')+'</span>';
    h+='</div>';
  }
  h+='</div>';
  h+='<div class="child-age-note"><b>Below 5 years:</b> Travel free \u00B7 <b>5 years & above:</b> Full price applies</div>';
  wrap.innerHTML=h;
}

function updateChildAge(idx,val){
  let age=parseInt(val);
  if(isNaN(age))age=0;
  age=Math.max(0,Math.min(17,age));
  S.childAges[idx]=age;
  const badge=$('cab-'+idx);
  if(badge){
    if(age<5){badge.textContent='Free';badge.className='child-age-badge free-tag';}
    else{badge.textContent='Full price';badge.className='child-age-badge full';}
  }
  clrE('passengers');reCalc();rSteps();uSum();
}

function selSsT(btn){const pk=btn.dataset.pk,tt=btn.dataset.tt;btn.parentElement.querySelectorAll('.ss-t').forEach(b=>b.classList.remove('sel'));btn.classList.add('sel');S.ssT[pk]=tt;if(tt==='privateBike'){if(!S.bkC[pk])S.bkC[pk]=1;const el=$('ssbv-'+pk);if(el)el.textContent=S.bkC[pk];}else if(tt==='cabWithDriver'||tt==='cabWithoutDriver'){if(!S.cbC[pk])S.cbC[pk]=1;const el=$('sscv-'+pk);if(el)el.textContent=S.cbC[pk];}uSsTUI(pk);uSum();}
function viCh(pk,t,d){if(t==='b'){S.bkC[pk]=Math.max(1,Math.min(10,(S.bkC[pk]||1)+d));const el=$('ssbv-'+pk);if(el)el.textContent=S.bkC[pk];}else{S.cbC[pk]=Math.max(1,Math.min(10,(S.cbC[pk]||1)+d));const el=$('sscv-'+pk);if(el)el.textContent=S.cbC[pk];}uSsTUI(pk);uSum();}
function uSsTUI(pk){const tt=S.ssT[pk]||'ownTransfer';const be=$('ssvi-b-'+pk),ce=$('ssvi-c-'+pk);if(be)be.classList.toggle('show',tt==='privateBike');if(ce)ce.classList.toggle('show',tt==='cabWithDriver'||tt==='cabWithoutDriver');if(tt==='privateBike'&&be){const el=$('ssbp-'+pk);if(el)el.textContent=fp(PR.sst.privateBike*(S.bkC[pk]||1));}if((tt==='cabWithDriver'||tt==='cabWithoutDriver')&&ce){const p=tt==='cabWithDriver'?PR.sst.cabWithDriver:PR.sst.cabWithoutDriver;const el=$('sscp-'+pk);if(el)el.textContent=fp(p*(S.cbC[pk]||1));}}
function togAct(el){el.classList.toggle('sel');const a=el.dataset.act;if(el.classList.contains('sel'))S.sel.set('act-'+a,{act:a});else S.sel.delete('act-'+a);rSteps();uSum();}
function togFd(el){el.classList.toggle('sel');const f=el.dataset.fd;if(el.classList.contains('sel')){S.sel.set('fd-'+f,{fd:f});clrE('food');}else S.sel.delete('fd-'+f);rSteps();uSum();}

function clrE(s){const el=$('sec-'+s);if(!el)return;el.classList.remove('has-error');const em=$('err-'+s);if(em)em.classList.remove('show');}
function showE(s){const el=$('sec-'+s);if(!el)return;el.classList.add('has-error');el.classList.remove('filled');const em=$('err-'+s);if(em)em.classList.add('show');setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),50);}
function validate(){let ok=true;if(!S.days){showE('duration');ok=false;}else clrE('duration');if(S.adults<1){showE('passengers');ok=false;}else clrE('passengers');if(!S.hotel){showE('hotel');ok=false;}else clrE('hotel');let hasSs=false;for(const k of S.sel.keys())if(k.startsWith('ss-')){hasSs=true;break;}if(!hasSs){showE('sightseeing');ok=false;}else clrE('sightseeing');let hasFd=false;for(const k of S.sel.keys())if(k.startsWith('fd-')){hasFd=true;break;}if(!hasFd){showE('food');ok=false;}else clrE('food');return ok;}
function reCalc(){if(S.pickup&&S.pickup!=='skip'){const el=$('puP');if(el)el.textContent=fp(PR.tr.pickup*S.adults);}if(S.drop&&S.drop!=='skip'){const el=$('doP');if(el)el.textContent=fp(PR.tr.drop*S.adults);}}

function buildWAMsg(){let total=0;let m='\uD83D\uDCAB *TT World \u2014 Goa Trip Booking*\n';m+='\uD83D\uDCC5 _Date: '+new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})+'_\n\n';m+='\uD83D\uDCC5 *Trip Details*\n\u2022 Duration: '+S.days+' Days / '+S.nights+' Nights\n\u2022 Adults: '+S.adults;if(S.childAges.length>0){m+='\n\u2022 Children:';for(let i=0;i<S.childAges.length;i++)m+=' Child '+(i+1)+' ('+S.childAges[i]+' yrs'+(S.childAges[i]<5?' - Free)':')');}m+='\n\n\uD83D\uDE97 *Transport*\n';if(S.pickup==='skip'&&S.drop==='skip'){m+='\u2022 Own arrangement (skipped)\n';}else{if(S.pickup&&S.pickup!=='skip'){const p=PR.tr.pickup*S.adults;m+='\u2022 Pickup: '+(S.pickup==='airport'?'Airport':'Railway')+' \u2014 '+fp(p)+'\n';total+=p;}if(S.drop&&S.drop!=='skip'){const p=PR.tr.drop*S.adults;m+='\u2022 Drop: '+(S.drop==='airport'?'Airport':'Railway')+' \u2014 '+fp(p)+'\n';total+=p;}}if(S.hotel){const pp=PR.hpn[S.hotel];const p=Math.round(pp*ppl()*S.nights);total+=p;m+='\n\uD83C\uDFE8 *Hotel*\n\u2022 '+hM[S.hotel].name+'\n\u2022 '+fp(pp)+'/night \u00D7 '+S.nights+'N \u00D7 '+ppl()+'p = *'+fp(p)+'*\n';}let ssLines=[];for(const[k,v]of S.sel){if(!k.startsWith('ss-'))continue;const pk=v.pk;const info=ssPr(pk);let line='\u2022 '+fmtPkName(pk);const tt=S.ssT[pk]||'ownTransfer';if(tt!=='ownTransfer'){if(tt==='privateBike') line+=' ('+(S.bkC[pk]||1)+' Bike';else line+=' (Cab';line+=')';}line+=' \u2014 '+fp(info.total);ssLines.push(line);total+=info.total;}if(ssLines.length){m+='\n\uD83D\uDDFA\uFE0F *Sightseeing*\n';m+=ssLines.join('\n')+'\n';}let actLines=[];for(const[k,v]of S.sel){if(!k.startsWith('act-'))continue;const p=Math.round(PR.ot[v.act]*ppl());total+=p;actLines.push('\u2022 '+fmtPkName(v.act)+' \u2014 '+fp(p));}if(actLines.length){m+='\n\uD83C\uDFAF *Activities*\n';m+=actLines.join('\n')+'\n';}let fdLines=[];for(const[k,v]of S.sel){if(!k.startsWith('fd-'))continue;const pp=PR.fd[v.fd];const p=Math.round(pp*ppl()*S.days);total+=p;fdLines.push('\u2022 '+v.fd.charAt(0).toUpperCase()+v.fd.slice(1)+' ('+fp(pp)+'/pax \u00D7 '+S.days+'d) \u2014 '+fp(p));}if(fdLines.length){m+='\n\uD83C\uDF7D\uFE0F *Food*\n';m+=fdLines.join('\n')+'\n';}m+='\n\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n\uD83D\uDCB0 *Grand Total: '+fp(total)+'*\n\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\n\nPlease confirm this booking.\n_\u2014 Sent from TT World Goa Trip Planner_';return{text:m,total};}

function sendWA(){if(!validate()){toast('Please complete all required fields first.','error');return;}const{text}=buildWAMsg();window.open('https://wa.me/'+WA_NUM+'?text='+encodeURIComponent(text),'_blank');toast('Opening WhatsApp...','success');}

function uSum(){let total=0,rows=[];rows.push({c:'Trip',n:S.days+' Days / '+S.nights+' Nights',p:null});rows.push({c:'Trip',n:fmtPplBreakdown(),p:null});if(S.pickup&&S.pickup!=='skip'){const p=PR.tr.pickup*S.adults;rows.push({c:'Transport',n:'Pickup \u2014 '+(S.pickup==='airport'?'Airport':'Railway')+' (\u20B9'+PR.tr.pickup+'\u00D7'+S.adults+')',p:p});total+=p;}if(S.drop&&S.drop!=='skip'){const p=PR.tr.drop*S.adults;rows.push({c:'Transport',n:'Drop \u2014 '+(S.drop==='airport'?'Airport':'Railway')+' (\u20B9'+PR.tr.drop+'\u00D7'+S.adults+')',p:p});total+=p;}if(S.pickup==='skip'&&S.drop==='skip')rows.push({c:'Transport',n:'Own arrangement',p:null,skipped:true});if(S.hotel){const pp=PR.hpn[S.hotel];const p=pp*ppl()*S.nights;rows.push({c:'Hotel',n:hM[S.hotel].name+' ('+fp(pp)+'/nt \u00D7 '+S.nights+'N \u00D7 '+ppl()+'p)',p:p});total+=p;}for(const[k,v]of S.sel){if(!k.startsWith('ss-'))continue;const pk=v.pk;const info=ssPr(pk);let sub='Base: '+fp(info.bp*ppl());if(info.tp>0){const tt=S.ssT[pk]||'ownTransfer';sub+=tt==='privateBike'?' + '+(S.bkC[pk]||1)+' Bike(s): '+fp(info.tp):' + Cab: '+fp(info.tp);}rows.push({c:'Sightseeing',n:fmtPkName(pk),p:info.total,sub:sub});total+=info.total;}for(const[k,v]of S.sel){if(!k.startsWith('act-'))continue;const p=PR.ot[v.act]*ppl();rows.push({c:'Activities',n:fmtPkName(v.act),p:p});total+=p;}for(const[k,v]of S.sel){if(!k.startsWith('fd-'))continue;const pp=PR.fd[v.fd];const p=pp*ppl()*S.days;rows.push({c:'Food',n:v.fd.charAt(0).toUpperCase()+v.fd.slice(1)+' ('+fp(pp)+'/pax \u00D7 '+S.days+'d)',p:p});total+=p;}const sc=$('sumC');if(!sc)return;if(rows.length<=2){sc.innerHTML='<div class="s-empty">Complete the form above to see your cost breakdown.</div>';uSubI();return;}let html='',lastC='';for(const r of rows){if(r.c!==lastC){html+='<div class="s-cat">'+r.c+'</div>';lastC=r.c;}html+='<div class="s-row"><span class="sr-n">'+r.n+(r.sub?'<span class="sr-sub">'+r.sub+'</span>':'')+(r.skipped?' <span class="s-skipped">\u2014 skipped</span>':'')+'</span>'+(r.p!==null?'<span class="sr-p">'+fp(r.p)+'</span>':'')+'</div>';}html+='<div class="s-total"><span class="st-l">Grand Total</span><span class="st-v">'+fp(total)+'</span></div>';sc.innerHTML=html;uSubI();for(const s of secs){const el=$('sec-'+s);if(!el)continue;const st=secSt(s);el.classList.toggle('filled',st==='done');el.classList.remove('has-error');const em=$('err-'+s);if(em)em.classList.remove('show');}rSteps();}

function uSubI(){let d=0;for(const s of['duration','passengers','hotel','sightseeing','food'])if(secSt(s)==='done')d++;const el=$('subInfo');if(el)el.innerHTML='<strong>'+d+'</strong> of <strong>5</strong> required sections completed';}
function submitForm(){if(!validate()){toast('Please complete all required fields before previewing.','error');return;}genPrev();}
function clearAll(){loadForm();toast('Form cleared successfully.','success');}

function genPrev(){const{text}=buildWAMsg();const tmp=document.createElement('div');tmp.innerHTML=$('sumC').innerHTML;let rows=[],cc='';const children=tmp.childNodes;for(let i=0;i<children.length;i++){const n=children[i];if(n.classList&&n.classList.contains('s-cat')){cc=n.innerText;}else if(n.classList&&n.classList.contains('s-row')){const t=n.innerText;const parts=t.split('\u20B9');rows.push({c:cc,n:parts[0]||'',p:parts.length>1?'\u20B9'+parts.slice(1).join('\u20B9'):''});}else if(n.classList&&n.classList.contains('s-total')){const t=n.innerText;const parts=t.split('\u20B9');rows.push({c:'TOTAL',n:parts[0]||'',p:parts.length>1?'\u20B9'+parts.slice(1).join('\u20B9'):'',isT:true});}}let tr='';if(rows.length){tr='<table id="pt"><thead><tr><th>Category</th><th>Item</th><th style="text-align:right">Price</th></tr></thead><tbody>';for(const r of rows){if(r.isT)tr+='<tr style="font-weight:700;font-size:1.15rem;border-top:3px solid #00897b;"><td></td><td>'+r.n+'</td><td style="text-align:right">'+r.p+'</td></tr>';else tr+='<tr><td style="color:#888;font-size:0.85rem">'+(r.c||'')+'</td><td>'+r.n+'</td><td style="text-align:right">'+r.p+'</td></tr>';}tr+='</tbody></table>';}const pw=window.open('','_blank','width=900,height=1200');pw.document.write('<!DOCTYPE html><html><head><title>TT World \u2014 Trip Cost</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:"Inter",sans-serif;background:#f4f6fb;color:#1a1d2e;}.top{background:linear-gradient(135deg,#1a1d2e,#2a2d3e);padding:36px 28px 26px;text-align:center;color:#fff;}.top .brand{font-family:"Playfair Display",serif;font-size:2.2rem;font-weight:700;}.top .brand .tt{color:#ffe500;}.top .sub{font-size:.95rem;margin-top:4px;font-style:italic;opacity:.85;}.top .tags{margin:16px 0 8px;}.top .tags span{background:rgba(255,229,0,0.15);border-radius:50px;padding:4px 12px;font-size:.8rem;font-weight:600;margin:0 4px;display:inline-block;color:#ffe500;}.top .ct{font-size:.85rem;margin-top:8px;opacity:.8;}.top .addr{font-size:.8rem;margin-top:3px;opacity:.65;}.ybar{background:#e8f5e9;padding:12px;text-align:center;}.ybar span{font-size:1.5rem;font-weight:800;color:#00897b;letter-spacing:3px;}.wrap{max-width:660px;margin:20px auto 0;padding:22px 18px 40px;background:#fff;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,0.06);}.wrap table{width:100%;border-collapse:collapse;font-size:.88rem;}.wrap th,.wrap td{padding:9px 10px;border-bottom:1px solid #eef1f6;text-align:left;}.wrap th{color:#8a90a4;font-size:.75rem;text-transform:uppercase;letter-spacing:1px;font-weight:600;border-bottom:2px solid #e2e6ee;}.wrap td{color:#4a5068;}.foot{text-align:center;padding:18px;color:#8a90a4;font-size:.82rem;font-weight:500;}@media print{body{background:#fff;}.wrap{box-shadow:none;margin:0 auto;}.top,.ybar,.foot{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}</style></head><body><div class="top"><div class="brand"><span class="tt">TT</span> World</div><div class="sub">Trip to the world</div><div class="tags"><span>Tour Packages</span><span>Flight Booking</span><span>Train Booking</span><span>Visa Services</span></div><div class="ct">www.triptotheworld.in \u00B7 +91 72000 87875</div><div class="addr">13/1, Arni Road, Kosapet, Vellore</div></div><div class="ybar"><span>TRIP COSTS</span></div><div class="wrap">'+tr+'</div><div class="foot">Travel far to find yourself \u2014 TT World</div></body></html>');pw.document.close();}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('imgModal').classList.contains('active'))$('imgModal').classList.remove('active');else if($('mapModal').classList.contains('active'))clMod('mapModal');else if($('amenModal').classList.contains('active'))clMod('amenModal');else if($('contactMod').classList.contains('active'))clContact();else if($('sidebar').classList.contains('active'))togSb();}});
window.onload=()=>{initBg();initLogo();loadForm();};
